<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Rec — Record what you're hearing</title>
    <meta
      name="description"
      content="Capture your Mac's audio output as lossless WAV. No drivers. No routing tricks. One click from the menu bar. Built for music makers, DJs, and producers."
    />
    <!-- Single-theme dark: the near-black ground is the brand, not a preference. -->
    <meta name="theme-color" content="#08080a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Open Graph -->
    <meta property="og:title" content="Home Rec — Record what you're hearing" />
    <meta
      property="og:description"
      content="Capture your Mac's audio output as lossless WAV. No drivers. No routing tricks. One click from the menu bar."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://homerec.app/" />
    <!-- Fonts: Archivo (display, matching the app) + Inter (body). Monospace
         metadata uses the system mono stack — same instrument the app uses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
