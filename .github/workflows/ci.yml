name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    # NOTE: the runner's Xcode must provide the macOS SDK this project targets.
    # If the image's Xcode is too old, pin a newer one with `xcode-select` below
    # or bump the runner image. See the "Select Xcode" step.
    runs-on: macos-15
    # Without this, GitHub's default is SIX HOURS. A single hung test then
    # quietly consumes the runner budget and leaves no log to diagnose from.
    # The suite completes in 2-3 minutes; 20 is generous headroom that still
    # fails fast.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # Adjust to an installed Xcode whose SDK matches the project. List with:
        #   ls /Applications | grep Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      # ⚠️ TEMPORARY DIAGNOSTIC — revert immediately after this run.
      # The suite hangs at test-host launch on this branch: two runs produced
      # zero test cases, zero suites, and 18+ minutes of silence after the build
      # completed. `main` clears the same point in ~67s.
      # Narrowed to one suite of pure enum logic — no AppKit, no audio, no view
      # model. Still hangs => the host app is failing to launch and no test is
      # implicated. Passes => a specific test is responsible and we bisect suites.
      - name: Run unit tests (functional)
        # BLOCKING gate: full unit-test suite WITHOUT Thread Sanitizer. Covers all
        # correctness, including the AVAssetWriter-based encoder tests. No
        # TCC/Screen-Recording UI tests (can't run headless).
        run: |
          set -o pipefail
          xcodebuild test \
            -project HomeRec/HomeRec.xcodeproj \
            -scheme HomeRec \
            -destination 'platform=macOS' \
            -only-testing:HomeRecTests/RecordingStateTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -resultBundlePath TestResults-functional.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests (Thread Sanitizer, advisory)
        if: false   # TEMPORARY: silenced for the diagnostic run above
        # ADVISORY (continue-on-error): TSan reliably aborts the test host with
        # SIGABRT on this CI runner during the audio tests — a CoreMedia/AVFoundation
        # instrumentation issue exercised by the buffer fixtures (since BL-007), NOT
        # a race in our code, and not reproducible locally (the full suite + TSan
        # passes locally, repeatedly). We can't fix Apple's frameworks, so this step
        # does not block: it still runs and uploads results to surface real races
        # when it completes, but a system-framework abort won't fail the PR. The
        # authoritative TSan run for the BL-024 serial-queue guard is the local dev
        # loop (targeted `-enableThreadSanitizer YES` runs, which are reliable).
        # M4AEncoderTests is skipped — it aborts deterministically (AAC codec).
        # FLACEncoderTests is skipped for the same reason: it drives the same
        # AVFoundation/CoreAudio codec machinery via AVAudioFile. An aborting
        # host yields NO results for ANY test in this job, so one aborting suite
        # would silently destroy the advisory race signal for the whole run.
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project HomeRec/HomeRec.xcodeproj \
            -scheme HomeRec \
            -destination 'platform=macOS' \
            -only-testing:HomeRecTests \
            -skip-testing:HomeRecTests/M4AEncoderTests \
            -skip-testing:HomeRecTests/FLACEncoderTests \
            -enableThreadSanitizer YES \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            TestResults-functional.xcresult
          if-no-files-found: ignore
