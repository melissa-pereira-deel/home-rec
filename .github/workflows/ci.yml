name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    # NOTE: the runner's Xcode must provide the macOS SDK this project targets.
    # If the image's Xcode is too old, pin a newer one with `xcode-select` below
    # or bump the runner image. See the "Select Xcode" step.
    runs-on: macos-15
    # Without this, GitHub's default is SIX HOURS. A single hung test then
    # quietly consumes the runner budget and leaves no log to diagnose from.
    # The suite completes in 2-3 minutes; 20 is generous headroom that still
    # fails fast.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # Adjust to an installed Xcode whose SDK matches the project. List with:
        #   ls /Applications | grep Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Run unit tests (functional)
        # BLOCKING gate: full unit-test suite WITHOUT Thread Sanitizer. Covers all
        # correctness, including the AVAssetWriter-based encoder tests. No
        # TCC/Screen-Recording UI tests (can't run headless).
        run: |
          set -o pipefail
          xcodebuild test \
            -project HomeRec/HomeRec.xcodeproj \
            -scheme HomeRec \
            -destination 'platform=macOS' \
            -only-testing:HomeRecTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -resultBundlePath TestResults-functional.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests (Thread Sanitizer, advisory)
        # ADVISORY (continue-on-error): TSan reliably aborts the test host with
        # SIGABRT on this CI runner during the audio tests — a CoreMedia/AVFoundation
        # instrumentation issue exercised by the buffer fixtures (since BL-007), NOT
        # a race in our code, and not reproducible locally (the full suite + TSan
        # passes locally, repeatedly). We can't fix Apple's frameworks, so this step
        # does not block: it still runs and uploads results to surface real races
        # when it completes, but a system-framework abort won't fail the PR. The
        # authoritative TSan run for the BL-024 serial-queue guard is the local dev
        # loop (targeted `-enableThreadSanitizer YES` runs, which are reliable).
        # M4AEncoderTests is skipped — it aborts deterministically (AAC codec).
        # FLACEncoderTests is skipped for the same reason: it drives the same
        # AVFoundation/CoreAudio codec machinery via AVAudioFile. An aborting
        # host yields NO results for ANY test in this job, so one aborting suite
        # would silently destroy the advisory race signal for the whole run.
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project HomeRec/HomeRec.xcodeproj \
            -scheme HomeRec \
            -destination 'platform=macOS' \
            -only-testing:HomeRecTests \
            -skip-testing:HomeRecTests/M4AEncoderTests \
            -skip-testing:HomeRecTests/FLACEncoderTests \
            -enableThreadSanitizer YES \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            TestResults-functional.xcresult
          if-no-files-found: ignore

  release-build:
    name: Release build
    # BLOCKING gate, and deliberately a SEPARATE JOB rather than a step after
    # the tests (BL-156). Everything in `unit-tests` is a Debug build, and
    # Release is not the same compilation: whole-module, x86_64 as well as
    # arm64, and `#if DEBUG` code is gone from it.
    #
    # That last difference shipped a defect. A `#Preview` in a vendored file
    # referenced fixtures guarded by `#if DEBUG`; every Debug build and the
    # whole test suite passed, and the archive failed with "cannot find
    # 'GlassSampleWaveforms' in scope" — found by hand, mid-release, after the
    # tag had been cut. A green suite said nothing about whether the product
    # could be built at all.
    #
    # As a trailing step it inherited that same blindness from the other side:
    # any test failure — including a flaky one — skipped it, so exactly when
    # the tree was in doubt, nobody learned whether it still built. That
    # happened on `main` at 66d0702. A separate job has no `needs:`, so the two
    # gates fail independently and both always report.
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Release build
        run: |
          set -o pipefail
          xcodebuild build \
            -project HomeRec/HomeRec.xcodeproj \
            -scheme HomeRec \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

# NOT ADDED, deliberately: a job running `scripts/check-docs.sh`.
# It cannot pass on a clean checkout. Most of what it verifies lives in
# CLAUDE.md, which is gitignored, so on CI the file is absent and the script
# exits 1 on a missing-file error rather than on any disagreement about the
# code. It already skips its private/tech-debt.md section when that file is
# absent; the CLAUDE.md section needs the same treatment before this is worth a
# job, and the residue that would actually run here is only the rot guards.
# Adding it as-is would pin CI red permanently — the failure this file's other
# changes exist to remove.
