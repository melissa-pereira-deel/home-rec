name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pin the toolchain; do not inherit it. Both jobs read this, so they cannot
# drift apart, and `sudo xcode-select` is no longer needed.
#
# The macos-15 image's default `/Applications/Xcode.app` is **16.4 (Swift
# 6.1.2)**, and that default moves when GitHub rolls the image. So the compiler
# this project was being checked by had never actually been chosen — and the
# gap went unnoticed until it produced a hard failure:
#
#   error: 'isolated' deinit requires frontend flag
#          -enable-experimental-feature IsolatedDeinit
#
# `isolated deinit` (SE-0371) is stable from Swift 6.2 and experimental before
# it, so TD-008's four `isolated deinit` fixes — Clock, PermissionGrantWatcher,
# RecorderViewModel, RecordingController — compile on the 26.x toolchain used
# for development and not on 16.4. Both CI jobs failed in under 90 seconds
# while the same tree built clean locally.
#
# ⚠️ **The runner image has to match the Xcode, not just carry it.** The first
# attempt kept `macos-15` and pinned its newest Xcode, 26.3. That compiles — the
# Release job passed — and then every test in the suite failed in 0.000 s, with
# the test host dying at load:
#
#   dyld: symbol '_OBJC_CLASS_$_FigBaseCALayer' missing from root that overrides
#   .../MediaToolbox.framework. Use of that symbol in .../AVFCore.framework
#
# Xcode 26.3 ships CoreMedia/MediaToolbox roots that override macOS 15's system
# frameworks, and AVFCore then cannot resolve against them. Everything touching
# AVFoundation — which is the encoders, so most of the suite — aborts the host.
# A compile-only gate cannot see this; only running the tests can.
#
# So: `macos-26` with Xcode 26.4.1, which is also what development uses, so
# local and CI finally agree. The "Toolchain" step prints what is installed,
# making the next bump a lookup rather than a guess.
#
# This is also what makes `SWIFT_STRICT_CONCURRENCY = complete` a real gate: a
# warning count means nothing until the compiler producing it is named. The
# expected result is zero, measured here, on this version.

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

jobs:
  unit-tests:
    name: Unit tests
    # The Xcode that provides this project's macOS SDK is pinned in the
    # workflow-level `env` above, not selected here.
    runs-on: macos-26
    # Without this, GitHub's default is SIX HOURS. A single hung test then
    # quietly consumes the runner budget and leaves no log to diagnose from.
    # The suite completes in 2-3 minutes; 20 is generous headroom that still
    # fails fast.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        # Reports only; the selection is `DEVELOPER_DIR` above. The version
        # belongs in the log of every run: this job's last failure was a
        # toolchain mismatch, and it was diagnosable only because the old step
        # printed one.
        run: |
          xcodebuild -version
          swift --version
          ls /Applications | grep '^Xcode'

      - name: Run unit tests (functional)
        # BLOCKING gate: full unit-test suite WITHOUT Thread Sanitizer. Covers all
        # correctness, including the AVAssetWriter-based encoder tests. No
        # TCC/Screen-Recording UI tests (can't run headless).
        run: |
          set -o pipefail
          xcodebuild test \
            -project HomeRec/HomeRec.xcodeproj \
            -scheme HomeRec \
            -destination 'platform=macOS' \
            -only-testing:HomeRecTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -resultBundlePath TestResults-functional.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests (Thread Sanitizer, advisory)
        # ADVISORY (continue-on-error): a race report must not fail the PR, but
        # the next step must say what this one found. Read that step, not this
        # one: TSan writes to the test host's stderr, which xcodebuild keeps
        # inside the .xcresult and never prints here.
        #
        # `halt_on_error=0` keeps the host alive through a report. Without it
        # the host died on the FIRST report, and Swift Testing then marked every
        # unfinished test "crashed" in 0.000 s — so one report, real or not,
        # decided how much of the suite was checked at all. On all nine runs
        # sampled (2026-09-07 to 2026-11-15, two images), between 7 and 234 of
        # ~376 tests finished, and each run held exactly one report.
        #
        # The report it kept stopping at was a TSan false positive in the test
        # fixtures, not a race in the app (BL-182): AVAudioPCMBuffer recycles
        # sample memory through a private malloc zone TSan cannot see. The
        # fixtures now allocate with malloc — see SampleBufferFixtures. The
        # earlier "CoreMedia/AVFoundation abort" diagnosis described that same
        # report from the outside, and the M4AEncoderTests / FLACEncoderTests
        # skips it justified are gone: both suites run clean under TSan.
        #
        # Nothing is skipped, so the race check covers the whole unit suite. It
        # covers only what the suite exercises: not ScreenCaptureKit capture,
        # which needs Screen Recording permission a runner cannot grant.
        continue-on-error: true
        env:
          # xcodebuild hands TEST_RUNNER_<NAME> to the test host as <NAME>.
          TEST_RUNNER_TSAN_OPTIONS: halt_on_error=0
        run: |
          set -o pipefail
          xcodebuild test \
            -project HomeRec/HomeRec.xcodeproj \
            -scheme HomeRec \
            -destination 'platform=macOS' \
            -only-testing:HomeRecTests \
            -enableThreadSanitizer YES \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Report Thread Sanitizer findings
        # Annotates each distinct race as a warning, and a host crash (tests
        # marked crashed, so never checked) or an empty run as an error, and
        # writes the counts to the job summary. Advisory like the run itself:
        # it fails this step, visibly, but never the PR.
        if: always()
        continue-on-error: true
        run: scripts/tsan-report.sh TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            TestResults-functional.xcresult
          if-no-files-found: ignore

  release-build:
    name: Release build
    # BLOCKING gate, and deliberately a SEPARATE JOB rather than a step after
    # the tests (BL-156). Everything in `unit-tests` is a Debug build, and
    # Release is not the same compilation: whole-module, x86_64 as well as
    # arm64, and `#if DEBUG` code is gone from it.
    #
    # That last difference shipped a defect. A `#Preview` in a vendored file
    # referenced fixtures guarded by `#if DEBUG`; every Debug build and the
    # whole test suite passed, and the archive failed with "cannot find
    # 'GlassSampleWaveforms' in scope" — found by hand, mid-release, after the
    # tag had been cut. A green suite said nothing about whether the product
    # could be built at all.
    #
    # As a trailing step it inherited that same blindness from the other side:
    # any test failure — including a flaky one — skipped it, so exactly when
    # the tree was in doubt, nobody learned whether it still built. That
    # happened on `main` at 66d0702. A separate job has no `needs:`, so the two
    # gates fail independently and both always report.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        # Reports only; the selection is `DEVELOPER_DIR` above. The version
        # belongs in the log of every run: this job's last failure was a
        # toolchain mismatch, and it was diagnosable only because the old step
        # printed one.
        run: |
          xcodebuild -version
          swift --version
          ls /Applications | grep '^Xcode'

      - name: Release build
        run: |
          set -o pipefail
          xcodebuild build \
            -project HomeRec/HomeRec.xcodeproj \
            -scheme HomeRec \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  docs-check:
    name: Docs check
    # BLOCKING gate (BL-160): `scripts/check-docs.sh`, which fails when the
    # docs claim something the code no longer does. It used to be left out of
    # CI because it could not pass on a clean checkout — the checks that read
    # the gitignored CLAUDE.md exited 1 on the missing file, not on any
    # disagreement about the code. Those checks now skip with a printed note
    # when the file is absent, as the private/tech-debt.md ones always did.
    #
    # The ceiling, stated plainly: here the script can only check what is
    # public — the code invariants that need no doc (sandbox off, the .screen
    # handler, the version-config count, the nonisolated encoders), the rot
    # guards against README.md, and the release evidence in README.md and
    # docs/manual-acceptance.md. Everything it verifies against CLAUDE.md or
    # private/tech-debt.md is checked only on the maintainer's machine; the
    # log names each skipped check, and a green run here says nothing about
    # them.
    #
    # The release-evidence checks make this job red on any commit whose
    # MARKETING_VERSION has no run-log entry in docs/manual-acceptance.md, or
    # whose README badge or footer names another version. That is the BL-179
    # gate, moved from "before the tag" to "before the merge": a version bump
    # does not go green until the manual pass for it is recorded.
    #
    # A separate job, like release-build, so it fails independently and always
    # reports. It is plain shell and needs no Xcode, so it runs on Linux — which
    # means the script must stay portable between GNU and BSD tools, since it is
    # also run by hand on macOS.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documented facts
        run: scripts/check-docs.sh
